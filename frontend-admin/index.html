<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人博客系统</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563EB'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>B</text></svg>">
</head>
<body>
  <!-- 登录页面 -->
  <div class="login-page" id="loginPage">
    <div class="login-card">
      <div class="login-header">
        <div class="login-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        </div>
        <h2 class="login-title">个人博客系统</h2>
        <p class="login-subtitle">请登录以继续</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">用户名</label>
          <input class="form-input" id="loginUsername" placeholder="请输入用户名" autocomplete="username" required>
        </div>
        <div class="form-group">
          <label class="form-label">密码</label>
          <input class="form-input" id="loginPassword" type="password" placeholder="请输入密码" autocomplete="current-password" required>
        </div>
        <div id="loginError" style="color:var(--color-danger);font-size:13px;margin-bottom:12px;display:none;"></div>
        <button class="btn btn-primary" type="submit" id="loginBtn" style="width:100%;height:40px;font-size:15px;">登 录</button>
      </form>
    </div>
  </div>

  <div class="app-layout" id="appLayout" style="display:none;">
    <!-- 侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        </div>
        <span class="sidebar-title">个人博客</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-group-label">概览</div>
        <div class="nav-item active" data-page="dashboard" onclick="navigateTo('dashboard')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          <span>仪表盘</span>
        </div>
        <div class="nav-group-label">内容管理</div>
        <div class="nav-item" data-page="posts" onclick="navigateTo('posts')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          <span>文章管理</span>
        </div>
        <div class="nav-item" data-page="profiles" onclick="navigateTo('profiles')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span>个人资料</span>
        </div>
        <div class="nav-item" data-page="comments" onclick="navigateTo('comments')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>评论管理</span>
        </div>
        <div class="nav-group-label">浏览</div>
        <div class="nav-item" data-page="blog" onclick="navigateTo('blog')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
          <span>博客浏览</span>
        </div>
      </nav>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 顶部栏 -->
      <header class="header">
        <div class="header-left">
          <button class="menu-toggle" onclick="toggleSidebar()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 class="header-title" id="pageTitle">仪表盘</h1>
        </div>
        <div class="header-right">
          <div class="user-dropdown" id="userDropdown">
            <div class="user-trigger" onclick="toggleUserDropdown()">
              <div class="user-avatar" id="headerAvatar">A</div>
              <span class="user-name" id="headerUserName">管理员</span>
              <svg class="user-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </div>
            <div class="user-dropdown-menu" id="userDropdownMenu">
              <div class="user-dropdown-item" onclick="handleLogout()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span>退出登录</span>
              </div>
            </div>
          </div>
        </div>
      </header>

      <!-- 页面容器 -->
      <div class="page-content">
        <!-- 仪表盘页面 -->
        <div id="page-dashboard" class="page-view"></div>
        <!-- 文章管理页面 -->
        <div id="page-posts" class="page-view" style="display:none;"></div>
        <!-- 个人资料页面 -->
        <div id="page-profiles" class="page-view" style="display:none;"></div>
        <!-- 评论管理页面 -->
        <div id="page-comments" class="page-view" style="display:none;"></div>
        <!-- 博客浏览页面 -->
        <div id="page-blog" class="page-view" style="display:none;"></div>
        <!-- 文章详情页面 -->
        <div id="page-article" class="page-view" style="display:none;"></div>
      </div>
    </main>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal 容器 -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModalOnOverlay(event)">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- 确认对话框 -->
  <div class="modal-overlay confirm-dialog" id="confirmOverlay">
    <div class="modal" id="confirmContent"></div>
  </div>

  <!-- JS 模块 -->
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/modal.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/dashboard.js"></script>
  <script src="/js/posts.js"></script>
  <script src="/js/profiles.js"></script>
  <script src="/js/comments.js"></script>
  <script src="/js/blog.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
