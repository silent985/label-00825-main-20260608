<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人博客</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563EB'/><text x='50' y='68' font-size='50' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>B</text></svg>">
  <style>
    .public-header {
      background: linear-gradient(135deg, #1D4ED8 0%, #2563EB 50%, #3B82F6 100%);
      color: #fff;
      padding: 0;
      position: sticky;
      top: 0;
      z-index: 40;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .public-header-inner {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .public-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .public-logo svg { width: 28px; height: 28px; }
    .public-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .public-nav a {
      color: rgba(255,255,255,0.9);
      text-decoration: none;
      padding: 8px 16px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .public-nav a:hover {
      background: rgba(255,255,255,0.15);
      color: #fff;
    }
    .public-main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
      min-height: calc(100vh - 140px);
    }
    .public-hero {
      text-align: center;
      padding: 48px 24px 32px;
    }
    .public-hero h1 {
      font-size: 36px;
      font-weight: 700;
      color: var(--color-text-primary);
      margin-bottom: 12px;
    }
    .public-hero p {
      font-size: 16px;
      color: var(--color-text-secondary);
      max-width: 600px;
      margin: 0 auto;
    }
    .public-footer {
      text-align: center;
      padding: 24px;
      color: var(--color-text-placeholder);
      font-size: 13px;
      border-top: 1px solid var(--color-border-light);
      margin-top: 48px;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 16px;
      background: var(--color-bg-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      color: var(--color-text-regular);
      cursor: pointer;
      font-size: 14px;
      margin-bottom: 20px;
      transition: all 0.15s;
    }
    .back-btn:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }
    @media (max-width: 640px) {
      .public-hero h1 { font-size: 28px; }
      .public-header-inner { padding: 12px 16px; }
      .public-main { padding: 16px; }
    }
  </style>
</head>
<body>
  <header class="public-header">
    <div class="public-header-inner">
      <div class="public-logo" onclick="showPublicHome()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        个人博客
      </div>
      <nav class="public-nav">
        <a href="/admin.html" style="background:rgba(255,255,255,0.15);">管理登录</a>
      </nav>
    </div>
  </header>

  <main class="public-main" id="publicMain">
  </main>

  <footer class="public-footer">
    &copy; 2026 个人博客 &nbsp;·&nbsp; Powered by Node.js + SQLite
  </footer>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/utils.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/public.js"></script>
</body>
</html>
